<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Panoramia Capital</title>
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
      sizes="1254x1254"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-48x48.png"
      sizes="48x48"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-32x32.png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Archivo, system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, #f5f5f5 0%, transparent 45%),
          #ffffff;
        color: #111111;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      p.code {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #737373;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p.lead {
        margin: 0 0 1.75rem;
        color: #525252;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.75rem 1.25rem;
        background: #111111;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover {
        background: #303030;
      }
      a:focus-visible {
        outline: 2px solid #111111;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p class="lead">
        The address you requested does not exist or is no longer available.
      </p>
      <a href="/en">Back to home</a>
    </main>
  </body>
</html>
